# Three-layer comparison — ConnectX-6 PF (00:04.0, mlx5 PMD).
# Unified inner config: UDP 64B, batch=128, single worker,
# copy-payload=false, sample-interval=0.  Differs from T-soft/T-vf
# ONLY in the dpdk section.
#
# SAFETY: NO-CARRIER on ens4np0 — PHY has no link partner, packets
# cannot reach the wire.  Measures PCIe DMA + NIC TX descriptor path.

dpdk:
  allow: "0000:00:04.0"     # ConnectX-6 PF — must use multi-char key
                              # for --allow= format.  Single-char -a
                              # format is misparsed by DPDK's EAL.
  main-lcore: 0
  l: "0-1"
  n: 2
  proc-type: auto

injector:
  p: 0x1
  q: 1
  auto-start: true
  batch: 128
  batch-delay-us: 0
  sample-interval: 0
  mode: tx-only
  num: -1
  arp: 0
  icmp: 0
  tcp: 0
  udp: 100
  sctp: 0
  latency-hist-enable: false
  mi-smoothing-window: 1

bless:
  hw-offload: []
  ether:
    mtu: 0
    copy-payload: false
    dst: "02:00:00:00:00:01"
    imix: [64]
    type:
      ipv4:
        src: "10.0.0.1+64"
        dst: ["192.168.1.1"]
        udp:
          src: "20000+1"
          dst: "53+1"
          payload: "b"
  vxlan:
    enable: false
  erroneous:
    ratio: 0

system:
  daemonize: false
  theme: default
  server:
    service:
      websocket: /wsURL
      http:
        - /api/control
        - /api/stats
        - /metrics
    options:
      listening_ports: "127.0.0.1:8000"
      num_threads: 4
      enable_keep_alive: yes
