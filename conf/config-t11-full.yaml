# T11 full workload — HW PF, distribution + sampler + mutation + VXLAN
# Reference Ladder: measure combined overhead (worst-case realistic workload)
# Outer IP format: src uses IP:VNI, dst is plain IP

dpdk:
  allow: "0000:00:04.0"
  main-lcore: 0
  l: "0-1"
  n: 2
  proc-type: auto

injector:
  p: 0x1
  q: 1
  auto-start: true
  batch: 128
  batch-delay-us: 0
  sample-interval: 64
  mode: tx-only
  num: 500000000
  arp: 0
  icmp: 0
  tcp: 1
  udp: 3
  sctp: 1
  latency-hist-enable: false
  mi-smoothing-window: 1

bless:
  hw-offload: []
  ether:
    mtu: 0
    copy-payload: false
    dst: "02:00:00:00:00:01"
    imix: [64]
    type:
      ipv4:
        src: "10.0.0.1+64"
        dst: ["192.168.1.1"]
        tcp:
          src: "10000+1"
          dst: "80+1"
          payload: "b"
        udp:
          src: "20000+1"
          dst: "53+1"
          payload: "b"
        sctp:
          src: "30000+1"
          dst: "3868+1"
  vxlan:
    enable: true
    ratio: 50
    ether:
      type:
        ipv4:
          src: "172.16.0.1:100+10"
          dst: ["172.16.1.1"]
          udp:
            src: 45000
            dst: 4789
  erroneous:
    ratio: 10
    class:
      udp: [len]
      ipv4: [version]

system:
  daemonize: false
  theme: default
  server:
    service:
      websocket: /wsURL
      http:
        - /api/control
        - /api/stats
        - /metrics
    options:
      listening_ports: "127.0.0.1:8000"
      num_threads: 4
      enable_keep_alive: yes
