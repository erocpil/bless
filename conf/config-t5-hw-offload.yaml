# T5 — HW PF, fixed-UDP, HW checksum offload
# Same as T3 but bless.hw-offload: ['ipv4', 'udp']

dpdk:
  allow: "0000:00:04.0"
  main-lcore: 0
  l: "0-1"
  n: 2
  proc-type: auto

injector:
  p: 0x1
  q: 1
  auto-start: true
  batch: 128
  batch-delay-us: 0
  sample-interval: 0
  mode: tx-only
  num: 500000000
  arp: 0
  icmp: 0
  tcp: 0
  udp: 100
  sctp: 0
  latency-hist-enable: false
  mi-smoothing-window: 1

bless:
  hw-offload: ["ipv4", "udp"]
  ether:
    mtu: 0
    copy-payload: false
    dst: "02:00:00:00:00:01"
    imix: [64]
    type:
      ipv4:
        src: "10.0.0.1"
        dst: ["192.168.1.1"]
        udp:
          src: "20000"
          dst: "53"
          payload: "b"
  vxlan:
    enable: false
  erroneous:
    ratio: 0

system:
  daemonize: false
  theme: default
  server:
    service:
      websocket: /wsURL
      http:
        - /api/control
        - /api/stats
        - /metrics
    options:
      listening_ports: "127.0.0.1:8000"
      num_threads: 4
      enable_keep_alive: yes
