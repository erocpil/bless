## Bless smoke-test config for VXLAN-over-IPv6 verification.
## Uses net_null PMD (pure memory, no real NIC needed).
##
## Key: outer_ipv6: true — VXLAN tunnel uses IPv6 outer header
## (ETH + IPv6 + UDP + VXLAN, 70 bytes) instead of IPv4 (50 bytes).
dpdk:
  a: null
  b: null
  no-pci: ""
  no-huge: ""
  no-shconf: ""
  vdev: net_null0
  main-lcore: 0
  l: 0-1
  n: 2

injector:
  p: 0x1
  q: 1
  auto-start: true
  batch: 32
  mode: tx-only
  num: -1

bless:
  hw-offload: [ ipv6, tcp, udp ]
  ether:
    dst: 02:00:00:00:00:01
    src: 02:00:00:00:00:02
    dist:
      ipv4: 0
      ipv6: 100
      tcp: 0
      udp: 0
      arp: 0
      icmp: 0
      sctp: 0
    type:
      ipv4:
        src: 10.0.0.1
        dst: 10.0.0.2
      ipv6:
        src: "2001:db8::1+10"
        dst: ["2001:db8::100", "2001:db8::200"]
        tcp:
          src: 40000
          dst: 80
        udp:
          src: [50000, 50100]
          dst: 53
  vxlan:
    enable: true
    ratio: 50
    outer_ipv6: true
    ether:
      type:
        ipv6:
          src: "fd00:10::1+5"
          dst: "fd00:20::100+5"
          udp:
            src: 45000
            dst: 4789

system:
  daemonize: false
  theme: default
  server:
    service:
      websocket: /wsURL
      http:
        - /api/control
        - /api/stats
        - /metrics
    options:
      listening_ports: "127.0.0.1:8000"
      num_threads: 4
      enable_keep_alive: yes
