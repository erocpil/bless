<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bless Metrics Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'SF Mono', 'Fira Code', monospace;
  background: #0d1117;
  color: #c9d1d9;
  overflow: hidden;
  height: 100vh;
}
.toolbar {
  padding: 8px 16px;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  height: 42px;
}
.toolbar h1 {
  font-size: 14px;
  font-weight: 600;
  color: #58a6ff;
  margin-right: 4px;
}
.toolbar button {
  padding: 4px 10px;
  background: #21262d;
  color: #c9d1d9;
  border: 1px solid #30363d;
  border-radius: 4px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
}
.toolbar button:hover { background: #30363d; }
.toolbar button:disabled {
  background: #161b22;
  cursor: not-allowed;
  opacity: 0.6;
}
.toolbar input {
  padding: 4px 8px;
  background: #0d1117;
  color: #c9d1d9;
  border: 1px solid #30363d;
  border-radius: 4px;
  font-family: inherit;
  font-size: 11px;
  min-width: 200px;
}
.toolbar input:disabled { background: #161b22; cursor: not-allowed; }
.toolbar input:focus { outline: none; border-color: #58a6ff; }
.toolbar label { font-size: 11px; color: #8b949e; }
.url-group { display: flex; align-items: center; gap: 6px; }
.toolbar .status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #f44;
  display: inline-block;
}
.status-dot.connected { background: #3fb950; }
.container {
  overflow: auto;
  height: calc(100vh - 42px);
  padding: 8px 16px 240px 16px;
}

/* -- Table -- */
:root {
  --metric-col-width: 220px;
  --console-alpha: 0.8;
  --glass-blur: 10px;
}
table {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
  position: relative;
}
.col-resizer {
  position: absolute; right: 0; top: 0;
  width: 6px; height: 100%;
  cursor: col-resize;
  background: transparent;
}
th, td {
  border: 1px solid #21262d;
  padding: 5px 8px;
  white-space: nowrap;
  text-align: right;
  min-width: 100px;
  font-size: 11px;
}
th { background-clip: padding-box; }
th.metric {
  background: #161b22;
  color: #c9d1d9;
  text-align: left;
  position: sticky; top: 0; left: 0;
  z-index: 40;
  font-weight: 600;
  width: var(--metric-col-width);
  min-width: 120px;
  max-width: 480px;
  isolation: isolate;
  font-size: 11px;
}
tbody th.metric {
  position: sticky; top: 29px; left: 0;
  z-index: 15;
  background: #0d1117;
  font-weight: 400;
  border-right: 1px solid #30363d;
}
td.metric {
  background: #0d1117;
  color: #c9d1d9;
  text-align: left;
  position: sticky; left: 0;
  z-index: 12;
  font-weight: 400;
  width: var(--metric-col-width);
  min-width: 120px;
  max-width: 480px;
  font-size: 11px;
}
th.metric:hover .col-resizer { background: rgba(255,255,255,0.08); }
th.port {
  background: #161b22;
  color: #8b949e;
  position: sticky; top: 0;
  z-index: 20;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  font-weight: 600;
}
th.total {
  background: #1c2128;
  color: #8b949e;
  position: sticky; top: 0;
  z-index: 20;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  font-weight: 600;
}
.group-header {
  background: #1c2128;
  color: #8b949e;
  font-weight: 600;
  text-align: left;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-top: 1px solid #30363d;
}
.group-header td { background: #1c2128; }
.xstats { background: #0d1117; }
.xstats-group th.metric { background: #1c2128; color: #8b949e; }
.xstats-group td { background: #0d1117; }
table td {
  background: #0d1117;
  color: #c9d1d9;
}
table tr:not(.group-header):hover td { background: #161b22; }
.group-header:hover td,
.group-header:hover th { background: #1c2128; }

/* -- Cell values -- */
.error-value { color: #f44 !important; font-weight: bold; background: rgba(255,68,68,0.08); }
.value-main {
  font-size: 13px;
  font-weight: 600;
  color: #f0f6fc;
  min-height: 16px;
}
.value-delta {
  font-size: 10px;
  color: #484f58;
  min-height: 13px;
}
.value-delta.pos { color: #3fb950; }
.value-delta.neg { color: #f44; }
.value-rate {
  font-size: 10px;
  color: #58a6ff;
  min-height: 13px;
}
.no-data {
  padding: 40px;
  text-align: center;
  color: #484f58;
  font-size: 12px;
}

/* -- Console -- */
#console {
  position: fixed;
  right: 20px; bottom: 20px;
  width: 750px; height: 500px;
  background: rgba(22,27,34,var(--console-alpha));
  color: #c9d1d9;
  border: 1px solid #30363d;
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  display: flex;
  flex-direction: column;
  z-index: 9999;
  font-size: 11px;
  line-height: 1.3;
  resize: both;
  overflow: hidden;
  min-width: 300px;
  min-height: 180px;
  max-width: 90vw;
  max-height: 90vh;
}
#console.glass {
  background: rgba(22,27,34,0.65);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
}
#console.glass .log-line { text-shadow: 0 0 2px rgba(0,0,0,0.5); }
#console.hidden { display: none; }
#console-header {
  background: transparent;
  padding: 4px 8px;
  font-weight: 600;
  cursor: move;
  display: flex;
  justify-content: space-between;
  user-select: none;
  color: #8b949e;
  font-size: 11px;
}
#console-header button {
  padding: 0 6px;
  font-size: 12px;
  line-height: 16px;
  height: 16px;
  background: transparent;
  border: none;
  color: #484f58;
  cursor: pointer;
}
#console-header button:hover { color: #c9d1d9; }
.console-header-tools {
  display: flex;
  align-items: center;
  gap: 6px;
}
#console-tabs {
  display: flex;
  background: transparent;
}
#console-tabs button {
  flex: 1;
  padding: 4px;
  background: none;
  border: none;
  color: #484f58;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
}
#console-tabs button.active {
  color: #c9d1d9;
  box-shadow: inset 0 -1px 0 #58a6ff;
}
#console-body {
  flex: 1;
  overflow: visible;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.tab {
  flex: 1;
  display: none;
  flex-direction: column;
  min-height: 0;
}
.tab.active { display: flex; }
.log-area, .cmd-output {
  flex: 1;
  padding: 6px;
  overflow-y: auto;
  overflow-x: hidden;
  white-space: pre-wrap;
  font-family: inherit;
  font-size: 11px;
  line-height: 1.3;
  min-height: 0;
  background: transparent;
}
.log-line { margin-bottom: 2px; }
.console-actions {
  display: flex;
  gap: 6px;
  padding: 4px 6px;
  border-bottom: 1px solid #21262d;
  align-items: center;
}
.console-actions label { color: #484f58; font-size: 11px; }
.console-actions input {
  width: 60px;
  background: #0d1117;
  color: #c9d1d9;
  border: 1px solid #30363d;
  font-size: 11px;
}
.console-actions button {
  padding: 2px 6px;
  font-size: 10px;
  line-height: 1.2;
  border-radius: 3px;
  background: #21262d;
  color: #c9d1d9;
  border: 1px solid #30363d;
  font-family: inherit;
}
.console-actions button:hover { background: #30363d; color: #f0f6fc; }
#console input[type="range"] {
  height: 22px; padding: 0; margin: 0 6px;
  background: transparent; cursor: pointer; position: relative;
}
#console input[type="range"]::-webkit-slider-runnable-track {
  height: 2px; background: #30363d; border-radius: 2px;
}
#console input[type="range"]::-moz-range-track {
  height: 2px; background: #30363d; border-radius: 2px;
}
#console input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px; height: 8px; border-radius: 50%;
  background: #8b949e; margin-top: -3px; cursor: pointer;
}
#console input[type="range"]::-moz-range-thumb {
  width: 8px; height: 8px; border-radius: 50%;
  background: #8b949e; border: none; cursor: pointer;
}
#console input[type="range"]:hover::-webkit-slider-thumb { background: #c9d1d9; }
#console input[type="range"]:hover::-webkit-slider-runnable-track { background: #484f58; }
.cmd-input {
  border-top: 1px solid #21262d;
  padding: 4px;
}
.cmd-input textarea {
  width: 100%; height: 48px;
  resize: none;
  background: #0d1117;
  color: #c9d1d9;
  border: 1px solid #30363d;
  font-family: inherit;
  font-size: 11px;
}
.cmd-hint {
  font-size: 10px;
  color: #484f58;
  margin-top: 2px;
}
#console-toggle {
  position: fixed;
  right: 20px; bottom: 20px;
  padding: 6px 10px;
  background: #21262d;
  color: #c9d1d9;
  border: 1px solid #30363d;
  border-radius: 4px;
  z-index: 9998;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
}
#console-toggle:hover { background: #30363d; }
body::after { content: ''; display: block; height: 200px; }
</style>
</head>
<body>

<div class="toolbar">
  <h1>📊 Dashboard</h1>
  <div class="url-group">
    <label>Server:</label>
    <input type="url" id="wsUrlInput" autocomplete="off" autocapitalize="off"
      spellcheck="false" data-lpignore="true" data-1p-ignore
      placeholder="ws://127.0.0.1:8000/wsURL" />
    <label>API Key:</label>
    <input type="password" id="apiKeyInput" autocomplete="new-password"
      data-lpignore="true" data-1p-ignore placeholder="BLESS_API_KEY (optional)" />
  </div>
  <button onclick="toggleConnection()" id="connectBtn">Connect</button>
  <button onclick="toggleMode()">Mode: <span id="mode">Formatted</span></button>
  <button onclick="toggleRate()">Rate: <span id="rateMode">ON</span></button>
  <button onclick="toggleTotal()">Total: <span id="totalMode">SHOW</span></button>
  <button onclick="openDashboard('/entropy')" id="entropyBtn" disabled style="background:#1f6feb;color:#fff;border-color:#1f6feb">🔥 Entropy</button>
  <button onclick="openDashboard('/observe')" id="observeBtn" disabled style="background:#1f6feb;color:#fff;border-color:#1f6feb">📊 Observe</button>
  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Disconnected</span>
  </div>
</div>

<div class="container">
  <div id="noData" class="no-data">Click Connect to start receiving data...</div>
  <table id="metrics" style="display: none;"></table>
</div>

<div id="console" class="hidden">
  <div id="console-header">
    <span>Console</span>
    <div class="console-header-tools">
      <label style="font-size:10px; opacity:0.8;">
        <input type="checkbox" id="glassToggle"> Glass
      </label>
      <input id="opacitySlider" type="range" min="50" max="100" value="80" title="Opacity">
      <input id="blurSlider" type="range" min="0" max="30" value="10" title="Blur" style="display:none">
      <button onclick="toggleConsole()">✕</button>
    </div>
  </div>
  <div id="console-tabs">
    <button class="active" onclick="switchTab('cmd', event)">Cmd</button>
    <button onclick="switchTab('log', event)">Log</button>
  </div>
  <div id="console-body">
    <div id="tab-cmd" class="tab active">
      <div id="cmdOutput" class="cmd-output"></div>
      <div class="cmd-input">
        <textarea id="cmdInput" placeholder="Enter command..."></textarea>
        <div class="cmd-hint">Ctrl + Enter to send</div>
      </div>
    </div>
    <div id="tab-log" class="tab">
      <div class="console-actions">
        <button onclick="clearLog()">Clear</button>
        <label>Max:</label>
        <input id="maxLogLinesInput" type="number" value="20" min="50" />
        <label><input type="checkbox" id="newestFirstToggle" checked /> Newest first</label>
        <label><input type="checkbox" id="freezeToggle" /> Freeze</label>
      </div>
      <div id="logArea" class="log-area"></div>
    </div>
  </div>
</div>

<button id="console-toggle" onclick="toggleConsole()">Console</button>

<script>
let ws = null;
let prev = {};
let prevTs = 0;
let displayMode = "FORMATTED";
let rateEnabled = true;
let totalVisible = true;
let lastData = null;
let isConnected = false;
let connectedWsUrl = null;

const STATS_ORDER = ['ipackets', 'opackets', 'ibytes', 'obytes', 'imissed', 'ierrors', 'oerrors', 'rx_nombuf'];
const ERROR_KEYS = ['imissed', 'ierrors', 'oerrors', 'rx_nombuf'];

const DEFAULT_WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') +
  location.host + '/wsURL';

function withoutApiKey(url) {
  try {
    const parsed = new URL(url, location.href);
    parsed.searchParams.delete('api_key');
    if (url.startsWith('/')) {
      return parsed.pathname + parsed.search + parsed.hash;
    }
    return parsed.toString();
  } catch (_) {
    /* Do not retain credentials even if an old saved URL is malformed. */
    return DEFAULT_WS_URL;
  }
}

const savedWsUrl = localStorage.getItem('dpdk_ws_url');
let wsUrl = savedWsUrl ? withoutApiKey(savedWsUrl) : DEFAULT_WS_URL;
try {
  const saved = new URL(wsUrl, location.href);
  if (saved.pathname !== '/wsURL' || !/^wss?:$/.test(saved.protocol)) wsUrl = DEFAULT_WS_URL;
} catch (_) {
  wsUrl = DEFAULT_WS_URL;
}
if (savedWsUrl && wsUrl !== savedWsUrl) {
  localStorage.setItem('dpdk_ws_url', wsUrl);
}

/* Page URL's ?api_key= always takes priority — even if localStorage
 * has a saved URL from a previous visit.  Always send a page-provided
 * credential to the same-origin endpoint, never to a saved remote URL. */
const pageQs = new URLSearchParams(location.search);
const pageApiKey = pageQs.get('api_key');
if (pageApiKey) {
  wsUrl = DEFAULT_WS_URL;
  pageQs.delete('api_key');
  const clean = location.pathname +
    (pageQs.toString() ? '?' + pageQs.toString() : '') + location.hash;
  history.replaceState(null, '', clean);
}

window.addEventListener("load", () => {
  const urlInput = document.getElementById('wsUrlInput');
  const keyInput = document.getElementById('apiKeyInput');
  urlInput.value = wsUrl;
  keyInput.value = pageApiKey || '';

  const savedOpacity = localStorage.getItem("console_opacity") || DEFAULT_OPACITY;
  opacitySlider.value = savedOpacity;
  setConsoleOpacity(savedOpacity);

  const savedBlur = localStorage.getItem("console_blur") || 10;
  blurSlider.value = savedBlur;
  setGlassBlur(savedBlur);

  const glassSaved = localStorage.getItem("console_glass") === "1";
  glassToggle.checked = glassSaved;
  setGlassMode(glassSaved);

  urlInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' && !isConnected) toggleConnection();
  });

  switchTab(initialTab);
});

const DEFAULT_OPACITY = 80;
const initialTab = localStorage.getItem("console_last_tab") || 'cmd';
let currentTab = 'cmd';

function normalizeWsUrl(url) {
  url = url.trim();
  if (url.startsWith('/')) return url;
  if (!url.startsWith('ws://') && !url.startsWith('wss://')) {
    const protocol = (location.protocol === 'https:') ? 'wss://' : 'ws://';
    url = protocol + url;
  }
  return url;
}

function toggleConnection() { isConnected ? disconnect() : connect(); }

function websocketUrlWithKey(url, key) {
  const parsed = new URL(url, location.href);
  parsed.searchParams.delete('api_key');
  if (key) parsed.searchParams.set('api_key', key);
  return parsed.toString().replace(/^http:/, 'ws:').replace(/^https:/, 'wss:');
}

function openDashboard(path) {
  if (!isConnected || !connectedWsUrl) {
    document.getElementById('statusText').innerText = 'Connect before opening dashboards';
    return;
  }
  const key = document.getElementById('apiKeyInput').value;
  const server = new URL(connectedWsUrl);
  server.protocol = server.protocol === 'wss:' ? 'https:' : 'http:';
  const target = new URL(path, server.origin);
  if (key) target.hash = new URLSearchParams({ api_key: key }).toString();
  window.open(target.toString(), '_blank', 'noopener');
}

function connect() {
  const urlInput = document.getElementById('wsUrlInput');
  const keyInput = document.getElementById('apiKeyInput');
  wsUrl = normalizeWsUrl(urlInput.value);
  try {
    const parsed = new URL(wsUrl, location.href);
    if (!/^wss?:$/.test(parsed.protocol) || parsed.pathname !== '/wsURL') {
      throw new Error('expected ws(s)://host[:port]/wsURL');
    }
  } catch (err) {
    document.getElementById('statusText').innerText =
      'Invalid Server — use ws(s)://host[:port]/wsURL';
    urlInput.focus();
    return;
  }
  localStorage.setItem('dpdk_ws_url', withoutApiKey(wsUrl));
  urlInput.value = wsUrl;
  const connectionUrl = websocketUrlWithKey(wsUrl, keyInput.value);

  try {
    ws = new WebSocket(connectionUrl);
    ws.onopen = () => {
      document.getElementById('conntxt') && (document.getElementById('conntxt').style.display = 'none');
      isConnected = true;
      connectedWsUrl = connectionUrl;
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').innerText = 'Connected';
      document.getElementById('connectBtn').innerText = 'Disconnect';
      urlInput.disabled = true;
      keyInput.disabled = true;
      document.getElementById('entropyBtn').disabled = false;
      document.getElementById('observeBtn').disabled = false;
    };
    ws.onmessage = e => {
      try {
        const data = JSON.parse(e.data);
        lastData = data;
        if (data.ports) render(data);
        if (data.cmdReply) cmdOutput.innerHTML += "% " + data.cmdReply + "\n\n";
        if (data.log) appendLog(data.log);
      } catch (err) { console.error('Parse error:', err); }
    };
    ws.onerror = () => {
      document.getElementById('statusText').innerText =
        'Connection Error — verify Server and BLESS_API_KEY';
    };
    ws.onclose = () => {
      isConnected = false;
      connectedWsUrl = null;
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').innerText = 'Disconnected';
      document.getElementById('connectBtn').innerText = 'Connect';
      urlInput.disabled = false;
      keyInput.disabled = false;
      document.getElementById('entropyBtn').disabled = true;
      document.getElementById('observeBtn').disabled = true;
    };
  } catch (err) {
    console.error('Connection error:', err);
    document.getElementById('statusText').innerText = 'Connection Failed';
    urlInput.disabled = false;
    keyInput.disabled = false;
  }
}

function disconnect() { if (ws) { ws.close(); ws = null; } }

function toggleMode() {
  displayMode = displayMode === "FORMATTED" ? "RAW" : "FORMATTED";
  document.getElementById("mode").innerText = displayMode === "FORMATTED" ? "Formatted" : "Raw";
}

function toggleRate() {
  rateEnabled = !rateEnabled;
  document.getElementById("rateMode").innerText = rateEnabled ? "ON" : "OFF";
}

function toggleTotal() {
  totalVisible = !totalVisible;
  document.getElementById("totalMode").innerText = totalVisible ? "SHOW" : "HIDE";
  // 重建表格使 Total 列按 totalVisible 状态生成/不生成
  const table = document.getElementById('metrics');
  if (table._built) {
    table._built = false;
    table._tbody = null;
    if (lastData) render(lastData);
  }
}

function formatNumber(v) {
  if (displayMode === "RAW") return v.toLocaleString();
  if (v >= 1e12) return (v / 1e12).toFixed(2) + ' T';
  if (v >= 1e9) return (v / 1e9).toFixed(2) + ' G';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + ' M';
  if (v >= 1e3) return (v / 1e3).toFixed(2) + ' K';
  return v.toLocaleString();
}

function formatRate(rate, isBytes) {
  if (!rate || rate === 0) return '0';
  if (isBytes) {
    const bits = rate * 8;
    if (bits >= 1e9) return (bits / 1e9).toFixed(2) + ' Gbps';
    if (bits >= 1e6) return (bits / 1e6).toFixed(2) + ' Mbps';
    if (bits >= 1e3) return (bits / 1e3).toFixed(2) + ' Kbps';
    return bits.toFixed(0) + ' bps';
  } else {
    if (rate >= 1e6) return (rate / 1e6).toFixed(2) + ' Mpps';
    if (rate >= 1e3) return (rate / 1e3).toFixed(2) + ' Kpps';
    return rate.toFixed(0) + ' pps';
  }
}

function render(data) {
  document.getElementById('noData').style.display = 'none';
  const table = document.getElementById('metrics');
  table.style.display = 'table';

  const ports = Object.keys(data.ports).sort();
  const currentTs = data.meta?.timestamp_ns || Date.now() * 1e6;
  const timeDelta = prevTs ? (currentTs - prevTs) / 1e9 : 1;

  if (!table._built) {
    table.innerHTML = '';
    const thead = document.createElement('thead');
    const hdr = document.createElement('tr');
    hdr.innerHTML = '<th class="metric">Metric<div class="col-resizer"></div></th>';
    if (totalVisible) hdr.innerHTML += '<th class="port total total-col">Total</th>';
    ports.forEach(p => { hdr.innerHTML += '<th class="port">Port ' + p + '</th>'; });
    thead.appendChild(hdr);
    table.appendChild(thead);
    table._tbody = document.createElement('tbody');
    table.appendChild(table._tbody);
    table._built = true;
  }

  const tbody = table._tbody;
  const groups = [];
  groups.push({ title: 'STATS', keys: STATS_ORDER, xstats: false });
  if (data.ports[ports[0]].xstats) {
    const allX = Object.keys(data.ports[ports[0]].xstats);
    if (allX.length > 0) {
      const xg = { 'RX': [], 'TX': [], 'Queue': [], 'PHY': [], 'Other': [] };
      allX.forEach(k => {
        if (k.startsWith('rx_q') || k.startsWith('tx_q')) xg['Queue'].push(k);
        else if (k.startsWith('rx_phy') || k.startsWith('tx_phy')) xg['PHY'].push(k);
        else if (k.startsWith('rx_')) xg['RX'].push(k);
        else if (k.startsWith('tx_')) xg['TX'].push(k);
        else xg['Other'].push(k);
      });
      Object.keys(xg).forEach(g => { if (xg[g].length) groups.push({ title: 'XSTATS - ' + g, keys: xg[g], xstats: true }); });
    }
  }

  let rowN = 0;
  const colNames = totalVisible ? ['total', ...ports] : [...ports];

  groups.forEach(group => {
    const gid = 'grp-' + rowN; rowN++;
    let gRow = document.getElementById(gid);
    if (!gRow) {
      gRow = document.createElement('tr');
      gRow.id = gid;
      gRow.className = group.xstats ? 'xstats-group' : 'group-header';
      gRow.innerHTML = '<th class="metric">' + group.title + '</th>';
      colNames.forEach(c => { gRow.innerHTML += '<td' + (c === 'total' ? ' class="total-col"' : '') + '></td>'; });
      tbody.appendChild(gRow);
    }

    group.keys.forEach(key => {
      const rid = 'row-' + key;
      let row = document.getElementById(rid);
      if (!row) {
        row = document.createElement('tr');
        row.id = rid;
        row.className = group.xstats ? 'xstats' : '';
        let html = '<th class="metric">' + key + '</th>';
        colNames.forEach(c => {
          const isBytes = key.includes('bytes') || key.includes('byte');
          const isPackets = key.includes('packets') || key.includes('packet');
          html += '<td id="c-' + key + '-' + c + '"' + (c === 'total' ? ' class="total-col"' : '') + '>' +
            '<div class="value-main" id="mv-' + key + '-' + c + '">0</div>' +
            '<div class="value-delta" id="dv-' + key + '-' + c + '">&nbsp;</div>' +
            ((isBytes || isPackets) ? '<div class="value-rate" id="rv-' + key + '-' + c + '">&nbsp;</div>' : '') +
            '</td>';
        });
        row.innerHTML = html;
        tbody.appendChild(row);
      }

      colNames.forEach(c => {
        let cur = 0, prv = 0;
        if (c === 'total') {
          ports.forEach(p => {
            const pd = data.ports[p];
            cur += group.xstats ? (pd.xstats?.[key] || 0) : (pd.stats?.[key] || 0);
            prv += prev[p] ? (group.xstats ? (prev[p].xstats?.[key] || 0) : (prev[p].stats?.[key] || 0)) : 0;
          });
        } else {
          const pd = data.ports[c];
          cur = group.xstats ? (pd.xstats?.[key] || 0) : (pd.stats?.[key] || 0);
          prv = prev[c] ? (group.xstats ? (prev[c].xstats?.[key] || 0) : (prev[c].stats?.[key] || 0)) : 0;
        }

        const delta = cur - prv;
        const rate = timeDelta > 0 ? delta / timeDelta : 0;
        const isBytes = key.includes('bytes') || key.includes('byte');
        const isPackets = key.includes('packets') || key.includes('packet');
        const isError = ERROR_KEYS.includes(key) || key.includes('error') || key.includes('missed');
        const canRate = isBytes || isPackets;

        const mv = document.getElementById('mv-' + key + '-' + c);
        if (mv) {
          mv.textContent = formatNumber(cur);
          mv.parentElement.className = (isError && cur > 0) ? 'error-value' : '';
        }
        const dv = document.getElementById('dv-' + key + '-' + c);
        if (dv) { dv.textContent = (delta !== 0) ? 'Δ ' + (delta >= 0 ? '+' : '') + formatNumber(delta) : '\u00a0'; dv.className = 'value-delta' + (delta > 0 ? ' pos' : delta < 0 ? ' neg' : ''); }
        const rv = document.getElementById('rv-' + key + '-' + c);
        if (rv && canRate) rv.textContent = rateEnabled ? formatRate(rate, isBytes) : '\u00a0';
      });
    });
  });

  if (!document.getElementById('tfoot-spacer')) {
    const foot = document.createElement('tfoot');
    const sr = document.createElement('tr');
    sr.id = 'tfoot-spacer';
    sr.innerHTML = '<td colspan="' + colNames.length + '" style="height:200px;border:none;background:transparent">&nbsp;</td>';
    foot.appendChild(sr);
    table.appendChild(foot);
  }

  prevTs = currentTs;
  prev = {};
  ports.forEach(p => {
    prev[p] = { stats: { ...data.ports[p].stats }, xstats: data.ports[p].xstats ? { ...data.ports[p].xstats } : undefined };
  });
}

const consoleEl = document.getElementById("console");
const logArea = document.getElementById("logArea");
const cmdOutput = document.getElementById("cmdOutput");
const maxLogInput = document.getElementById("maxLogLinesInput");
const newestFirstToggle = document.getElementById("newestFirstToggle");
const freezeToggle = document.getElementById("freezeToggle");
const cmdInput = document.getElementById("cmdInput");
let MAX_LOG_LINES = parseInt(maxLogInput.value, 10);
let newestFirst = true;
let freezeLog = false;

maxLogInput.onchange = () => { MAX_LOG_LINES = parseInt(maxLogInput.value, 10) || 100; };
newestFirstToggle.onchange = () => { newestFirst = newestFirstToggle.checked; };
freezeToggle.onchange = () => { freezeLog = freezeToggle.checked; };

function toggleConsole() {
  const opening = consoleEl.classList.contains("hidden");
  consoleEl.classList.toggle("hidden");
  if (opening) {
    const lastTab = localStorage.getItem("console_last_tab") || 'cmd';
    switchTab(lastTab);
  }
}

function switchTab(name, ev) {
  currentTab = name;
  localStorage.setItem("console_last_tab", name);
  document.querySelectorAll("#console-tabs button").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  if (ev && ev.target) {
    ev.target.classList.add("active");
  } else {
    document.querySelectorAll("#console-tabs button").forEach(btn => {
      const onclickAttr = btn.getAttribute("onclick");
      if (onclickAttr && onclickAttr.includes("'" + name + "'")) btn.classList.add("active");
    });
  }
}

function appendLog(log) {
  if (freezeLog) return;
  const div = document.createElement("div");
  div.className = "log-line";
  const ts = new Date().toISOString();
  const text = typeof log === "string" ? log : log.text ? log.text : JSON.stringify(log);
  div.textContent = "[" + ts + "] " + text;
  if (newestFirst) logArea.insertBefore(div, logArea.firstChild);
  else logArea.appendChild(div);
  while (logArea.children.length > MAX_LOG_LINES) {
    if (newestFirst) logArea.removeChild(logArea.lastChild);
    else logArea.removeChild(logArea.firstChild);
  }
  if (newestFirst) logArea.scrollTop = 0;
  else logArea.scrollTop = logArea.scrollHeight;
}

function clearLog() { logArea.innerHTML = ""; }

cmdInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); sendCmd(); }
});

function sendCmd() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const text = cmdInput.value.trim();
  if (!text) return;
  ws.send(JSON.stringify({ cmd: text }));
  cmdOutput.textContent += "> " + text + "\n";
  cmdOutput.scrollTop = cmdOutput.scrollHeight;
  cmdInput.value = "";
}

(function() {
  const header = document.getElementById("console-header");
  let drag = false, ox = 0, oy = 0;
  header.onmousedown = e => { drag = true; ox = e.clientX - consoleEl.offsetLeft; oy = e.clientY - consoleEl.offsetTop; };
  document.onmousemove = e => {
    if (!drag) return;
    consoleEl.style.left = e.clientX - ox + "px";
    consoleEl.style.top = e.clientY - oy + "px";
    consoleEl.style.right = "auto";
    consoleEl.style.bottom = "auto";
  };
  document.onmouseup = () => drag = false;
})();

function setConsoleOpacity(v) {
  const a = v / 100;
  document.documentElement.style.setProperty("--console-alpha", a);
  localStorage.setItem("console_opacity", v);
}

function setGlassBlur(v) {
  document.documentElement.style.setProperty("--glass-blur", v + "px");
  localStorage.setItem("console_blur", v);
}

function setGlassMode(enabled) {
  if (enabled) {
    consoleEl.classList.add("glass");
    blurSlider.style.display = "";
    opacitySlider.style.display = "none";
  } else {
    consoleEl.classList.remove("glass");
    blurSlider.style.display = "none";
    opacitySlider.style.display = "";
  }
  localStorage.setItem("console_glass", enabled ? "1" : "0");
}

(function() {
  let resizing = false;
  let startX = 0;
  let startWidth = 0;
  document.addEventListener("mousedown", e => {
    if (!e.target.classList.contains("col-resizer")) return;
    resizing = true;
    startX = e.clientX;
    startWidth = e.target.parentElement.offsetWidth;
    document.body.style.cursor = "col-resize";
    e.preventDefault();
  });
  document.addEventListener("mousemove", e => {
    if (!resizing) return;
    const dx = e.clientX - startX;
    const newWidth = Math.min(480, Math.max(120, startWidth + dx));
    document.documentElement.style.setProperty("--metric-col-width", newWidth + "px");
  });
  document.addEventListener("mouseup", () => {
    if (!resizing) return;
    resizing = false;
    document.body.style.cursor = "";
  });
})();

const glassToggle = document.getElementById("glassToggle");
const opacitySlider = document.getElementById("opacitySlider");
const blurSlider = document.getElementById("blurSlider");

glassToggle.addEventListener("change", () => setGlassMode(glassToggle.checked));
opacitySlider.addEventListener("input", e => setConsoleOpacity(e.target.value));
blurSlider.addEventListener("input", e => setGlassBlur(e.target.value));
</script>
